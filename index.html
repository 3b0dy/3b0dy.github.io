<!doctype html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="./assets/images/avatar.png" type="image/x-icon" />
    <title>عَبُّودي</title>
    <meta name="description" content="Web Developer & Lifelong Learner. Building digital solutions while chasing the best version of myself." />
    <!-- CSS -->
    <link rel="stylesheet" href="./assets/css/master.css" />
  </head>
  <body>
    <header class="header flex">
      <div class="container flex">
        <h1 class="logo flex">
          <img class="avatar" src="./assets/images/avatar.png" alt="3b0dy's Avatar" />
          <span class="name">عَبُّودِي</span>
        </h1>
        <nav class="navbar flex">
          <input type="checkbox" name="nav-menu-toggle" class="nav-menu-toggle flex" />
          <ul class="nav-menu flex">
            <li class="nav-menu-link flex"><i></i> <a href="#">الصفحة الرئيسية - Home</a></li>
            <li class="nav-menu-link flex"><i></i> <a href="#">من أنا؟ - About</a></li>
            <li class="nav-menu-link flex"><i></i> <a href="#">أعمالي - Portfolio</a></li>
            <li class="nav-menu-link flex"><i></i> <a href="#">خدماتي - Services</a></li>
            <li class="nav-menu-link flex"><i>󰍳</i> <a href="#">ماينكرافت - BTA</a></li>
            <li class="nav-menu-link flex"><i></i> <a href="#">تواصل معي - Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <script>
      // تحديد العناصر التي تستخدم خط Handjet
      const elements = document.querySelectorAll(".name");

      // نطاق اليونيكود الخاص بكل حركات التشكيل العربية (فتحة، ضمة، كسرة، شدة، تنوين..)
      const diacriticsRegex = /([\u064B-\u0652\u0670])/g;

      elements.forEach((element) => {
        const originalText = element.innerText;
        // استبدال التشكيل بـ span ملون
        element.innerHTML = originalText.replace(diacriticsRegex, '<span class="harakah">$1</span>');
      });
    </script>
  </body>
</html>
